[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-behavior-gap"
version = "0.1.0"
description = "Reproduction code and data for Utility-Behavior Gap experiments"
requires-python = ">=3.10"
dependencies = [
    "bottleneck>=1.3.6",
    "matplotlib>=3.7",
    "numpy>=1.23",
    "pandas>=1.5",
    "PyYAML>=6",
    "scipy>=1.9",
    "spacy>=3.7",
    "statsmodels>=0.13",
    "textstat>=0.7",
    "wordfreq>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
steering = [
    "torch>=2.5",
    "transformers @ git+https://github.com/huggingface/transformers.git",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "hf_transfer>=0.1.8",
    "kernels>=0.17",
    "flash-linear-attention>=0.5",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[tool.uv]
# `uv sync --extra steering` builds the GPU environment. spaCy is only needed by the
# paper's offline feature pipeline and stays in the base dependencies.
